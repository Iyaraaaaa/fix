name: veriframe_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
  cloud_firestore: ^6.3.0
  dio: ^5.4.0
  file_picker: ^11.0.2
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  provider: ^6.1.0
  share_plus: ^7.0.0
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  # New dependencies
  flutter_svg: ^2.0.10
  google_fonts: ^7.0.0
  responsive_builder: ^0.4.2
  package_info_plus: ^8.0.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.6
  pdf: ^3.10.8
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.2.2
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  crypto: ^3.0.3
  flutter_app_badger: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  # Opaque, branded icon used for iOS and legacy Android launchers
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  # Modern Android adaptive icon: padded logo on a deep-navy brand background
  adaptive_icon_background: "#080C14"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/veriframe_model.tflite
    - assets/labels.txt
  # Localization assets
  # The l10n tool will auto-detect ARB files under lib/l10n
  # No extra configuration needed for default settings
