services:
  - type: web
    name: veriframe-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: REALITY_DEFENDER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

